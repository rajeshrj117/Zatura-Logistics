<script>
// ============ HELPERS & SEED DATA ============
const $=s=>document.querySelector(s);
const LOCS=["Dubai","Jebel Ali","Dubai Investment Park","Al Quoz","Deira","Business Bay","Abu Dhabi","Sharjah","Ajman","Ras Al Khaimah","Al Barsha","Festival City"];
const TYPES=["Air Freight","Sea Freight","Road Freight","Local Delivery","International Cargo"];
const STATUSES=["Booking Confirmed","Pickup Scheduled","Picked Up","In Transit","Customs Clearance","Out for Delivery","Delivered","Delayed","Cancelled"];
const COMPANIES=["Emirates Retail Group","Noor Trading LLC","Al Futtaim Distribution","Desert Rose Foods","Gulf Pharma","TechZone UAE","Marina Foods","Oasis Electronics","Falcon Auto Parts","Palm Hospitality","Sahara Textiles","Blue Ocean Marine","City Mart Supermarkets","Vertex Construction","Lulu Wholesale"];
const NAMES=["Ahmed Al Mansoori","Fatima Khan","Rajesh Kumar","Priya Sharma","Mohammed Ali","Sara Ibrahim","Khalid Hassan","Anita Desai","Omar Farouk","Layla Nasser","Vikram Singh","Aisha Bello","Yusuf Osman","Meera Nair","Hassan Tariq"];
const VEH_TYPES=["Truck","Van","Pickup","Trailer","Refrigerated Truck","Flatbed"];
let _id=1000; const nid=p=>p+"-"+(++_id);
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function fmt(n){return "AED "+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0})}
function fmtDate(d){return new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
function daysAgo(n){let d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function daysAhead(n){let d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

function seedDB(){
  _id=1000;
  const customers=COMPANIES.map((c,i)=>({id:"CUS-"+(1001+i),company:c,contact:NAMES[i%NAMES.length],email:c.toLowerCase().replace(/[^a-z]+/g,'.')+"@gmail.com",phone:"+971 5"+rnd(0,9)+rnd(1000000,9999999),address:pick(LOCS)+", Dubai, UAE",trn:"100"+rnd(100000000,999999999),type:pick(["Corporate","SME","Retail","Wholesale","E-commerce"]),shipments:rnd(2,18),revenue:rnd(45000,420000)}));
  const drivers=NAMES.map((n,i)=>({id:"DRV-"+(201+i),name:n,phone:"+971 5"+rnd(0,9)+rnd(1000000,9999999),email:n.toLowerCase().replace(/\s+/g,'.')+"@zatura.ae",licence:"UAE-"+rnd(100000,999999),licenceExpiry:daysAhead(rnd(-20,300)),rating:(4+rnd(0,10)/10).toFixed(1),deliveries:rnd(40,320),performance:rnd(72,99),status:pick(["Available","On Trip","Available","On Trip"]),attendance:"Present"}));
  const vehicles=Array.from({length:12},(_,i)=>({id:"VEH-"+(301+i),reg:"DXB "+rnd(10000,99999),type:VEH_TYPES[i%VEH_TYPES.length],model:pick(["Volvo FH16","Mercedes Actros","Isuzu NPR","Toyota Hilux","Hino 500","MAN TGX"]),capacity:rnd(500,24000)+" kg",driver:drivers[i%drivers.length].name,location:pick(LOCS),fuel:pick(["Diesel","Petrol","Electric"]),insurance:daysAhead(rnd(-10,200)),maintenance:pick(["Available","On Trip","Under Maintenance","Available"]),fuelExpense:rnd(1200,8500),history:rnd(5,60)}));
  const shipments=Array.from({length:50},(_,i)=>{
    const st=STATUSES[i%STATUSES.length]; const cust=customers[i%customers.length]; const drv=drivers[i%drivers.length]; const veh=vehicles[i%vehicles.length];
    const pickup=daysAgo(rnd(0,25)); const exp=daysAhead(rnd(1,10));
    const delivered=st==="Delivered"?daysAgo(rnd(0,5)):null;
    const charges=rnd(850,18500); const add=rnd(0,1200);
    return {id:"SHP-"+(5001+i),customer:cust.company,customerId:cust.id,pickup:pick(LOCS),delivery:pick(LOCS),type:pick(TYPES),cargo:pick(["Electronics","FMCG Goods","Auto Parts","Pharmaceuticals","Textiles","Furniture","Machinery","Food Products","Building Materials"]),weight:rnd(50,8000),qty:rnd(1,120),vehicle:veh.reg,driver:drv.name,pickupDate:pickup,expDate:exp,actualDate:delivered,status:st,charges,additional:add,notes:pick(["Handle with care","Fragile items","Keep refrigerated","Urgent delivery","Customs docs attached",""])};
  });
  const warehouses=["Jebel Ali Central Hub","Al Quoz Warehouse","Deira Distribution Center","Dubai Investment Park Store","Abu Dhabi Logistics Hub"].map((n,i)=>({id:"WH-"+(401+i),name:n,location:LOCS[i],capacity:rnd(5000,20000),utilization:rnd(45,92)}));
  const inventory=Array.from({length:30},(_,i)=>({id:"INV-"+(601+i),name:pick(["Pallet Boxes","Steel Drums","Cartons","Crates","Bags","Containers"])+" "+pick(["A","B","C"])+"-"+rnd(10,99),sku:"SKU-"+rnd(10000,99999),category:pick(["General","Electronics","Food","Pharma","Fragile"]),qty:rnd(5,900),warehouse:warehouses[i%warehouses.length].name,storage:"Zone "+pick(["A","B","C","D"])+"-"+rnd(1,20),unit:pick(["pcs","kg","boxes","pallets"]),min:rnd(20,100)}));
  const invoices=Array.from({length:20},(_,i)=>{const s=shipments[i%shipments.length];const amt=s.charges+s.additional;return{id:"INV-2026-"+(8001+i),customer:s.customer,shipment:s.id,date:daysAgo(rnd(0,40)),due:daysAhead(rnd(-5,20)),amount:amt,paid:pick(["Paid","Unpaid","Partially Paid","Overdue"]),vat:Math.round(amt*0.05)}});
  const quotations=Array.from({length:15},(_,i)=>({id:"QTN-"+(9001+i),customer:customers[i%customers.length].company,route:pick(LOCS)+" → "+pick(LOCS),type:pick(TYPES),transport:rnd(1200,9500),loading:rnd(200,1500),customs:rnd(300,2500),additional:rnd(0,800),discount:rnd(0,10),status:pick(["Draft","Sent","Accepted","Rejected","Expired"]),date:daysAgo(rnd(0,20)),valid:daysAhead(rnd(1,30))}));
  const employees=NAMES.concat(["Nadia Rahman","Bilal Ahmed","Sana Malik","Tariq Aziz","Hana Saleh"]).map((n,i)=>({id:"EMP-"+(101+i),name:n,role:pick(["Operations Manager","Finance Manager","Fleet Manager","Warehouse Manager","Dispatcher","Driver","Employee","Managing Director"]),dept:pick(["Operations","Finance","Fleet","Warehouse","HR","Sales"]),email:n.toLowerCase().replace(/\s+/g,'.')+"@zatura.ae",phone:"+971 5"+rnd(0,9)+rnd(1000000,9999999),status:"Active",attendance:pick(["Present","Present","Present","Absent"]),performance:rnd(70,99),tasks:rnd(2,14)}));
  const notifications=Array.from({length:30},(_,i)=>({id:i+1,title:pick(["Shipment Delayed","Shipment Delivered","Payment Overdue","Vehicle Maintenance Due","Licence Expiry","Low Warehouse Stock","New Quotation","New Customer","Dispatch Assigned","Invoice Generated"]),msg:pick(["Shipment SHP-5001 delayed due to traffic in Jebel Ali","Payment of AED 12,500 overdue from Emirates Retail","Vehicle DXB 45210 maintenance due in 3 days","Low stock alert: SKU-45210 below minimum level","New quotation accepted by Noor Trading LLC"]),time:daysAgo(rnd(0,3))+" "+rnd(8,18)+":30",read:i>11,type:pick(["warning","success","danger","info"])}));
  const activities=Array.from({length:20},(_,i)=>({id:i+1,text:pick(["New shipment created","Shipment dispatched","Delivery completed","Invoice generated","Payment received","Vehicle assigned","Driver checked in","Stock received"]),user:NAMES[i%NAMES.length],time:daysAgo(rnd(0,2))+" "+rnd(8,19)+":15",shipment:"SHP-"+rnd(5001,5050)}));
  const documents=Array.from({length:18},(_,i)=>({id:"DOC-"+(701+i),name:pick(["Commercial Invoice","Packing List","Bill of Lading","Delivery Order","Customs Declaration","Certificate of Origin","Trade Licence","Insurance Certificate"])+" #"+rnd(100,999),type:pick(["Commercial Invoice","Packing List","Bill of Lading","Delivery Order","Customs Declaration","Certificate of Origin","Trade Licence","Insurance Certificate"]),shipment:"SHP-"+rnd(5001,5050),size:rnd(120,4800)+" KB",expiry:daysAhead(rnd(-15,180)),customs:pick(["Cleared","Pending","Under Review"]),date:daysAgo(rnd(0,20))}));
  const dispatches=Array.from({length:14},(_,i)=>({id:"DSP-"+(1101+i),shipment:"SHP-"+rnd(5001,5050),vehicle:vehicles[i%vehicles.length].reg,driver:drivers[i%drivers.length].name,route:pick(LOCS)+" → "+pick(LOCS),pickup:daysAhead(rnd(0,3)),delivery:daysAhead(rnd(2,6)),status:pick(["Pending","Dispatched","In Transit","Delivered","Failed"]),priority:pick(["High","Medium","Low"])}));
  const expenses=Array.from({length:12},(_,i)=>({id:"EXP-"+(1201+i),category:pick(["Fuel","Maintenance","Salaries","Warehouse Rent","Insurance","Customs Fees"]),amount:rnd(1500,28000),date:daysAgo(rnd(0,30)),vendor:pick(["ENOC","ADNOC","Emirates Insurance","Dubai Customs","Al Futtaim"])}));
  return {customers,drivers,vehicles,shipments,warehouses,inventory,invoices,quotations,employees,notifications,activities,documents,dispatches,expenses,settings:{company:"Zatura Logistics",location:"Dubai, UAE",currency:"AED",vat:5,theme:"Dark Navy",notif:true},automations:[{name:"Auto Driver Assignment",desc:"Assign nearest available driver on new shipment",on:true},{name:"Shipment Status Notifications",desc:"SMS & email on status change",on:true},{name:"Payment Reminders",desc:"Remind 3 days before invoice due",on:false},{name:"Maintenance Reminders",desc:"Alert 7 days before service due",on:true},{name:"Low-Stock Alerts",desc:"Notify warehouse manager on low stock",on:true}]};
}
let DB;
function loadDB(){try{DB=JSON.parse(localStorage.getItem('zatura_db_v2'))||seedDB()}catch(e){DB=seedDB()} saveDB()}
function saveDB(){localStorage.setItem('zatura_db_v2',JSON.stringify(DB))}
loadDB();

// ============ UI HELPERS ============
function toast(msg,type="success"){const c=type==="success"?"border-l-emerald-500":type==="error"?"border-l-rose-500":"border-l-blue-500";const ic=type==="success"?"check-circle":type==="error"?"alert-circle":"info";const el=document.createElement('div');el.className=`bg-white border border-slate-200 border-l-4 ${c} rounded-xl px-4 py-3 flex items-center gap-3 shadow-xl animate-in max-w-sm`;el.innerHTML=`<i data-lucide="${ic}" class="w-5 h-5 ${type==="success"?"text-emerald-600":type==="error"?"text-rose-600":"text-blue-600"}"></i><p class="text-sm font-medium text-slate-900">${msg}</p>`;$('#toastRoot').appendChild(el);lucide.createIcons();setTimeout(()=>el.remove(),3500)}
function openModal(title,body,wide){$('#modalRoot').innerHTML=`<div class="fixed inset-0 z-[90] bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="if(event.target===this)closeModal()"><div class="bg-white border border-slate-200 w-full ${wide?'max-w-3xl':'max-w-lg'} max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl shadow-2xl animate-in"><div class="sticky top-0 bg-white px-6 py-4 flex items-center justify-between border-b border-slate-200 z-10"><h3 class="font-display font-bold text-slate-900">${title}</h3><button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="p-6">${body}</div></div></div>`;lucide.createIcons()}
function closeModal(){$('#modalRoot').innerHTML=""}
function confirmDlg(msg,fn){window._confirmFn=fn;openModal("Confirm Action",`<p class="text-slate-700 text-sm mb-6">${msg}</p><div class="flex gap-3"><button onclick="closeModal()" class="flex-1 py-3 rounded-xl glass font-semibold">Cancel</button><button onclick="closeModal();window._confirmFn()" class="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 font-bold text-white">Confirm</button></div>`)}
function exportCSV(name,rows){if(!rows.length)return toast("No data to export","error");const csv=rows.map(r=>Object.values(r).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;a.click();toast("CSV exported successfully")}
function badge(s){const m={"Delivered":"bg-emerald-50 text-emerald-700 border-emerald-200","In Transit":"bg-blue-50 text-blue-700 border-blue-200","Delayed":"bg-rose-50 text-rose-700 border-rose-200","Cancelled":"bg-slate-50 text-slate-700 border-slate-200","Paid":"bg-emerald-50 text-emerald-700 border-emerald-200","Unpaid":"bg-rose-50 text-rose-700 border-rose-200","Overdue":"bg-rose-50 text-rose-700 border-rose-200","Available":"bg-emerald-50 text-emerald-700 border-emerald-200","On Trip":"bg-blue-50 text-blue-700 border-blue-200","Accepted":"bg-emerald-50 text-emerald-700 border-emerald-200","Sent":"bg-cyan-50 text-cyan-700 border-cyan-200","Draft":"bg-slate-50 text-slate-700 border-slate-200"};const c=m[s]||"bg-purple-50 text-purple-700 border-purple-200";return `<span class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${c} whitespace-nowrap">${s}</span>`}
function field(label,inner){return `<label class="block"><span class="text-xs font-semibold text-slate-500 mb-1.5 block">${label}</span>${inner}</label>`}
const inp="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 text-slate-900 placeholder:text-slate-500";

        <svg viewBox="0 0 400 260" preserveAspectRatio="none" class="absolute inset-0 w-full h-full opacity-70"><path d="M40,180 L120,60 L200,40 L300,70 L360,140 L320,220 L180,240 L60,220 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="200" cy="130" r="90" fill="none" stroke="#38bdf8" stroke-width=".5" opacity=".4"/></svg>

function drawDashCharts(mode="weekly"){const S=DB.shipments;const labels=mode==="weekly"?["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]:["Week 1","Week 2","Week 3","Week 4"];const del=labels.map((_,i)=>rnd(4,14));const pend=labels.map((_,i)=>rnd(2,8));
  makeChart('dashChart',{type:'bar',data:{labels,datasets:[{label:'Delivered',data:del,backgroundColor:'#10b981',borderRadius:6},{label:'Pending',data:pend,backgroundColor:'#3b82f6',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10}}},scales:{x:{grid:{display:false}},y:{beginAtZero:true}}}});
  makeChart('statusChart',{type:'doughnut',data:{labels:["Delivered","In Transit","Pending","Delayed","Cancelled"],datasets:[{data:[S.filter(s=>s.status==="Delivered").length,S.filter(s=>s.status==="In Transit").length,S.filter(s=>["Booking Confirmed","Pickup Scheduled","Picked Up"].includes(s.status)).length,S.filter(s=>s.status==="Delayed").length,S.filter(s=>s.status==="Cancelled").length],backgroundColor:["#10b981","#3b82f6","#f59e0b","#f43f5e","#64748b"],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{display:false}}}});
  makeChart('finChart',{type:'line',data:{labels:["Jan","Feb","Mar","Apr","May","Jun"],datasets:[{label:'Revenue',data:[180,220,195,260,240,310],borderColor:'#10b981',backgroundColor:'rgba(16,185,129,.15)',fill:true,tension:.4},{label:'Expenses',data:[120,140,130,150,145,170],borderColor:'#f43f5e',tension:.4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false}},y:{display:false}}}});
}
function dashChartMode(m){drawDashCharts(m);toast(m==="weekly"?"Weekly view applied":"Monthly view applied","info")}

function renderShipments(){

    <input type="date" value="${shipFilter.date}" onchange="shipFilter.date=this.value;shipPage=1;renderShipments()" class="${inp} w-auto"/>
    <button onclick="shipFilter={q:'',status:'',date:''};shipPage=1;renderShipments()" class="${btnG}">Clear</button>
  </div>
  <div class="glass rounded-3xl overflow-hidden animate-in"><div class="overflow-x-auto"><table class="w-full text-sm min-w-[1150px]"><thead><tr class="border-b border-slate-200 bg-slate-50 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-500"><th class="p-4">Shipment ID</th><th class="p-4">Customer</th><th class="p-4">Route</th><th class="p-4">Type</th><th class="p-4">Driver / Vehicle</th><th class="p-4">Dates</th><th class="p-4">Charges</th><th class="p-4">Status</th><th class="p-4">Actions</th></tr></thead><tbody>

  <div class="flex flex-wrap items-center gap-3 mb-5 animate-in"><div><h2 class="font-display text-xl font-bold text-slate-900">Warehouse Management</h2><p class="text-xs text-slate-500">${DB.warehouses.length} locations • ${DB.inventory.length} inventory items • ${low.length} low-stock alerts</p></div><div class="ml-auto flex gap-2"><button onclick="exportCSV('inventory.csv',DB.inventory)" class="${btnG}"><i data-lucide="download" class="w-4 h-4"></i> Export</button><button onclick="openInvModal()" class="${btnP} flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Add Item</button></div></div>
  <div class="grid sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-5">${DB.warehouses.map(w=>`<div class="glass rounded-3xl p-4 card-hover animate-in"><i data-lucide="warehouse" class="w-6 h-6 text-blue-600 mb-2"></i><p class="font-bold text-slate-900 text-sm">${w.name}</p><p class="text-xs text-slate-500">${w.location} • ${w.capacity} m²</p><div class="mt-2 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-blue-600" style="width:${w.utilization}%"></div></div><p class="text-[11px] text-slate-500 mt-1">${w.utilization}% utilized</p></div>`).join('')}</div>
  ${low.length?`<div class="rounded-3xl p-4 mb-4 bg-rose-50 border border-rose-200 flex items-center gap-3 animate-in"><i data-lucide="alert-triangle" class="w-5 h-5 text-rose-600"></i><p class="text-sm text-rose-700"><b>Low Stock Alert:</b> ${low.map(i=>i.name+" ("+i.qty+" left)").join(", ")}</p></div>`:""}
  <div class="glass rounded-3xl overflow-hidden animate-in"><div class="overflow-x-auto"><table class="w-full text-sm min-w-[1100px]"><thead><tr class="border-b border-slate-200 bg-slate-50 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-500"><th class="p-4">Item</th><th class="p-4">SKU</th><th class="p-4">Category</th><th class="p-4">Qty</th><th class="p-4">Warehouse</th><th class="p-4">Storage</th><th class="p-4">Min Level</th><th class="p-4">Actions</th></tr></thead><tbody>
  ${slice.map(i=>`<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-4 font-medium text-slate-900">${i.name}</td><td class="p-4 text-blue-600 text-xs">${i.sku}</td><td class="p-4 text-slate-500 text-xs">${i.category}</td><td class="p-4"><span class="font-bold ${i.qty<=i.min?'text-rose-600':'text-slate-900'}">${i.qty} ${i.unit}</span></td><td class="p-4 text-xs text-slate-500">${i.warehouse}</td><td class="p-4 text-xs text-slate-500">${i.storage}</td><td class="p-4 text-xs text-slate-500">${i.min}</td><td class="p-4"><div class="flex gap-1"><button onclick="stockMove('${i.id}',1)" class="px-2 py-1.5 rounded-lg bg-emerald-50 text-emerald-600 text-xs font-bold">Stock In</button><button onclick="stockMove('${i.id}',-1)" class="px-2 py-1.5 rounded-lg bg-rose-50 text-rose-600 text-xs font-bold">Stock Out</button><button onclick="openInvModal('${i.id}')" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="edit" class="w-4 h-4"></i></button><button onclick="confirmDlg('Delete item ${i.name}?',()=>{DB.inventory=DB.inventory.filter(x=>x.id!=='${i.id}');saveDB();renderWarehouse();toast('Item deleted')})" class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></td></tr>`).join('')}
  </tbody></table></div></div>${pagerHTML(invPage,total,p=>{invPage=p;renderWarehouse()})}`;
}
function stockMove(id,dir){const it=DB.inventory.find(x=>x.id===id);const amt=prompt(dir>0?"Stock IN quantity:":"Stock OUT quantity:","10");if(!amt)return;it.qty=Math.max(0,it.qty+dir*+amt);saveDB();toast(dir>0?"Stock received: "+it.name:"Stock dispatched: "+it.name);renderWarehouse()}
function openInvModal(id){const i=id?DB.inventory.find(x=>x.id===id):{name:"",sku:"SKU-"+rnd(10000,99999),category:"General",qty:100,warehouse:DB.warehouses[0].name,storage:"Zone A-1",unit:"pcs",min:20};
  openModal(id?"Edit Inventory":"Add Inventory Item",`<form onsubmit="saveInv(event,'${id||''}')" class="grid sm:grid-cols-2 gap-4">
  ${field("Item Name",`<input name="name" required value="${i.name}" class="${inp}"/>`)}${field("SKU",`<input name="sku" required value="${i.sku}" class="${inp}"/>`)}
  ${field("Category",`<select name="category" class="${inp}">${["General","Electronics","Food","Pharma","Fragile"].map(c=>`<option ${i.category===c?'selected':''}>${c}</option>`).join('')}</select>`)}
  ${field("Quantity",`<input name="qty" type="number" required value="${i.qty}" class="${inp}"/>`)}
  ${field("Warehouse",`<select name="warehouse" class="${inp}">${DB.warehouses.map(w=>`<option ${i.warehouse===w.name?'selected':''}>${w.name}</option>`).join('')}</select>`)}
  ${field("Storage Location",`<input name="storage" required value="${i.storage}" class="${inp}"/>`)}
  ${field("Unit",`<select name="unit" class="${inp}">${["pcs","kg","boxes","pallets"].map(u=>`<option ${i.unit===u?'selected':''}>${u}</option>`).join('')}</select>`)}
  ${field("Min Stock Level",`<input name="min" type="number" value="${i.min}" class="${inp}"/>`)}
  <div class="sm:col-span-2 flex gap-3"><button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl glass font-semibold">Cancel</button><button class="${btnP} flex-1">${id?"Update Item":"Add Item"}</button></div></form>`)}
function saveInv(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.qty=+d.qty;d.min=+d.min;if(id){Object.assign(DB.inventory.find(x=>x.id===id),d);toast("Inventory updated")}else{DB.inventory.unshift({id:"INV-"+(631+DB.inventory.length),...d});toast("Item added to inventory")}saveDB();closeModal();renderWarehouse()}

// ============ CUSTOMERS ============

  <div class="grid grid-cols-2 gap-2 mt-4"><div class="bg-slate-50 rounded-xl p-3 text-center"><p class="font-bold text-slate-900">${c.shipments}</p><p class="text-[10px] text-slate-500">Shipments</p></div><div class="bg-slate-50 rounded-xl p-3 text-center"><p class="font-bold text-emerald-600">${fmt(c.revenue)}</p><p class="text-[10px] text-slate-500">Revenue</p></div></div>
  <div class="flex gap-2 mt-4"><button onclick="viewCustomer('${c.id}')" class="${btnG} flex-1 justify-center !py-2 text-xs"><i data-lucide="eye" class="w-3.5 h-3.5"></i> View</button><button onclick="openCustomerModal('${c.id}')" class="${btnG} flex-1 justify-center !py-2 text-xs"><i data-lucide="edit" class="w-3.5 h-3.5"></i> Edit</button><button onclick="confirmDlg('Delete customer ${c.company}?',()=>{DB.customers=DB.customers.filter(x=>x.id!=='${c.id}');saveDB();renderCustomers();toast('Customer deleted')})" class="p-2.5 glass rounded-xl text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></div>`).join('')}</div>${pagerHTML(custPage,total,p=>{custPage=p;renderCustomers()})}`;
}
function openCustomerModal(id){const c=id?DB.customers.find(x=>x.id===id):{company:"",contact:"",email:"",phone:"+971 5",address:"Dubai, UAE",trn:"100",type:"Corporate",shipments:0,revenue:0};
  openModal(id?"Edit Customer":"Add Customer",`<form onsubmit="saveCustomer(event,'${id||''}')" class="grid sm:grid-cols-2 gap-4">
  ${field("Company Name",`<input name="company" required value="${c.company}" class="${inp}"/>`)}${field("Contact Person",`<input name="contact" required value="${c.contact}" class="${inp}"/>`)}
  ${field("Email",`<input name="email" type="email" required value="${c.email}" class="${inp}"/>`)}${field("Phone",`<input name="phone" required value="${c.phone}" class="${inp}"/>`)}
  ${field("UAE Address",`<input name="address" required value="${c.address}" class="${inp}"/>`)}${field("VAT TRN",`<input name="trn" required value="${c.trn}" class="${inp}"/>`)}
  ${field("Customer Type",`<select name="type" class="${inp}">${["Corporate","SME","Retail","Wholesale","E-commerce"].map(t=>`<option ${c.type===t?'selected':''}>${t}</option>`).join('')}</select>`)}
  ${field("Total Shipments",`<input name="shipments" type="number" value="${c.shipments}" class="${inp}"/>`)}
  <div class="sm:col-span-2 flex gap-3"><button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl glass font-semibold">Cancel</button><button class="${btnP} flex-1">${id?"Update Customer":"Add Customer"}</button></div></form>`)}
function saveCustomer(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.shipments=+d.shipments;d.revenue=+d.revenue||rnd(10000,100000);if(id){Object.assign(DB.customers.find(x=>x.id===id),d);toast("Customer updated")}else{DB.customers.unshift({id:"CUS-"+(1016+DB.customers.length),...d});toast("Customer added")}saveDB();closeModal();renderCustomers()}
function viewCustomer(id){const c=DB.customers.find(x=>x.id===id);const ships=DB.shipments.filter(s=>s.customer===c.company);const invs=DB.invoices.filter(i=>i.customer===c.company);
  openModal(c.company,`<div class="grid grid-cols-3 gap-3 mb-5 text-center"><div class="bg-slate-50 rounded-2xl p-4"><p class="font-display text-xl font-bold text-slate-900">${ships.length}</p><p class="text-[11px] text-slate-500">Shipments</p></div><div class="bg-slate-50 rounded-2xl p-4"><p class="font-display text-xl font-bold text-slate-900">${invs.length}</p><p class="text-[11px] text-slate-500">Invoices</p></div><div class="bg-slate-50 rounded-2xl p-4"><p class="font-display text-xl font-bold text-emerald-600">${fmt(c.revenue)}</p><p class="text-[11px] text-slate-500">Revenue</p></div></div>
  <div class="space-y-2 text-sm text-slate-700 mb-5"><p><i data-lucide="user" class="inline-block w-3.5 h-3.5 mr-1 align-[-2px] text-slate-400"></i>Contact: <b class="text-slate-900">${c.contact}</b></p><p><i data-lucide="mail" class="inline-block w-3.5 h-3.5 mr-1 align-[-2px] text-slate-400"></i>${c.email} • <i data-lucide="phone" class="inline-block w-3.5 h-3.5 mr-1 align-[-2px] text-slate-400"></i>${c.phone}</p><p><i data-lucide="map-pin" class="inline-block w-3.5 h-3.5 mr-1 align-[-2px] text-slate-400"></i>${c.address}</p><p><i data-lucide="receipt" class="inline-block w-3.5 h-3.5 mr-1 align-[-2px] text-slate-400"></i>TRN: ${c.trn} • Type: ${c.type}</p></div>
  <h4 class="font-bold text-slate-900 mb-2">Recent Shipments</h4>${ships.slice(0,4).map(s=>`<div class="flex justify-between py-2 border-b border-slate-100 text-sm"><span class="text-blue-600 font-bold">${s.id}</span><span class="text-slate-500 text-xs">${s.pickup} → ${s.delivery}</span>${badge(s.status)}</div>`).join('')||'<p class="text-slate-500 text-sm">No shipments yet</p>'}
  <button onclick="closeModal();openCustomerModal('${c.id}')" class="${btnP} w-full mt-5">Edit Customer</button>`,true)}

// ============ QUOTATIONS ============
function quoCalc(q){const sub=q.transport+q.loading+q.customs+q.additional;const disc=sub*q.discount/100;const vat=(sub-disc)*DB.settings.vat/100;return{sub,disc,vat,total:sub-disc+vat}}
function renderQuotations(){const {slice,total}=paginate(DB.quotations,quoPage,8);
  $('#pageContent').innerHTML=`
  <div class="flex flex-wrap items-center gap-3 mb-5 animate-in"><div><h2 class="font-display text-xl font-bold text-slate-900">Quotation Management</h2><p class="text-xs text-slate-500">${DB.quotations.length} quotations • VAT ${DB.settings.vat}% • Currency AED</p></div><div class="ml-auto flex gap-2"><button onclick="exportCSV('quotations.csv',DB.quotations)" class="${btnG}"><i data-lucide="download" class="w-4 h-4"></i> Export</button><button onclick="openQuoModal()" class="${btnP} flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> New Quotation</button></div></div>
  <div class="glass rounded-3xl overflow-hidden animate-in"><div class="overflow-x-auto"><table class="w-full text-sm min-w-[1150px]"><thead><tr class="border-b border-slate-200 bg-slate-50 text-left text-[11px] font-semibold uppercase tracking-wide text-slate-500"><th class="p-4">Quotation</th><th class="p-4">Customer</th><th class="p-4">Route</th><th class="p-4">Type</th><th class="p-4">Total (incl VAT)</th><th class="p-4">Valid Until</th><th class="p-4">Status</th><th class="p-4">Actions</th></tr></thead><tbody>
  ${slice.map(q=>{const c=quoCalc(q);return `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-4 font-bold text-blue-600">${q.id}</td><td class="p-4 text-slate-900 font-medium">${q.customer}</td><td class="p-4 text-slate-500 text-xs">${q.route}</td><td class="p-4 text-slate-700 text-xs">${q.type}</td><td class="p-4 font-bold text-slate-900">${fmt(c.total)}</td><td class="p-4 text-xs text-slate-500">${fmtDate(q.valid)}</td><td class="p-4">${badge(q.status)}</td><td class="p-4"><div class="flex flex-wrap gap-1"><button onclick="viewQuo('${q.id}')" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="eye" class="w-4 h-4"></i></button><button onclick="openQuoModal('${q.id}')" class="p-2 hover:bg-slate-100 rounded-lg"><i data-lucide="edit" class="w-4 h-4"></i></button><button onclick="quoAction('${q.id}','Accepted')" class="px-2 py-1.5 rounded-lg bg-emerald-50 text-emerald-600 text-[11px] font-bold">Accept</button><button onclick="quoAction('${q.id}','Rejected')" class="px-2 py-1.5 rounded-lg bg-rose-50 text-rose-600 text-[11px] font-bold">Reject</button><button onclick="quoToShipment('${q.id}')" class="px-2 py-1.5 rounded-lg bg-blue-50 text-blue-600 text-[11px] font-bold">→ Shipment</button><button onclick="confirmDlg('Delete quotation?',()=>{DB.quotations=DB.quotations.filter(x=>x.id!=='${q.id}');saveDB();renderQuotations();toast('Quotation deleted')})" class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div></td></tr>`}).join('')}
  </tbody></table></div></div>${pagerHTML(quoPage,total,p=>{quoPage=p;renderQuotations()})}`;
}
function openQuoModal(id){const q=id?DB.quotations.find(x=>x.id===id):{customer:DB.customers[0].company,route:"Dubai → Abu Dhabi",type:"Road Freight",transport:3000,loading:500,customs:800,additional:200,discount:5,status:"Draft",valid:daysAhead(15)};
  openModal(id?"Edit Quotation":"Create Quotation",`<form onsubmit="saveQuo(event,'${id||''}')" class="grid sm:grid-cols-2 gap-4">
  ${field("Customer",`<select name="customer" class="${inp}">${DB.customers.map(c=>`<option ${q.customer===c.company?'selected':''}>${c.company}</option>`).join('')}</select>`)}
  ${field("Route",`<input name="route" required value="${q.route}" class="${inp}"/>`)}
  ${field("Freight Type",`<select name="type" class="${inp}">${TYPES.map(t=>`<option ${q.type===t?'selected':''}>${t}</option>`).join('')}</select>`)}
  ${field("Transport Charges (AED)",`<input name="transport" type="number" required value="${q.transport}" class="${inp}"/>`)}
  ${field("Loading/Unloading (AED)",`<input name="loading" type="number" value="${q.loading}" class="${inp}"/>`)}
  ${field("Customs Handling (AED)",`<input name="customs" type="number" value="${q.customs}" class="${inp}"/>`)}
  ${field("Additional Charges (AED)",`<input name="additional" type="number" value="${q.additional}" class="${inp}"/>`)}
  ${field("Discount %",`<input name="discount" type="number" value="${q.discount}" class="${inp}"/>`)}
  ${field("Valid Until",`<input name="valid" type="date" required value="${q.valid}" class="${inp}"/>`)}
  ${field("Status",`<select name="status" class="${inp}">${["Draft","Sent","Accepted","Rejected","Expired"].map(s=>`<option ${q.status===s?'selected':''}>${s}</option>`).join('')}</select>`)}
  <div class="sm:col-span-2 flex gap-3"><button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl glass font-semibold">Cancel</button><button class="${btnP} flex-1">${id?"Update Quotation":"Create Quotation"}</button></div></form>`,true)}
function saveQuo(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));["transport","loading","customs","additional","discount"].forEach(k=>d[k]=+d[k]);if(id){Object.assign(DB.quotations.find(x=>x.id===id),d);toast("Quotation updated")}else{DB.quotations.unshift({id:"QTN-"+(9016+DB.quotations.length),date:daysAhead(0),...d});toast("Quotation created")}saveDB();closeModal();renderQuotations()}
function viewQuo(id){const q=DB.quotations.find(x=>x.id===id);const c=quoCalc(q);
  openModal("Quotation "+q.id,`<div class="space-y-2 text-sm mb-5">${[["Customer",q.customer],["Route",q.route],["Type",q.type],["Transport",fmt(q.transport)],["Loading/Unloading",fmt(q.loading)],["Customs Handling",fmt(q.customs)],["Additional",fmt(q.additional)],["Subtotal",fmt(c.sub)],["Discount ("+q.discount+"%)","- "+fmt(c.disc)],["VAT ("+DB.settings.vat+"%)",fmt(c.vat)],["TOTAL",fmt(c.total)]].map(([k,v])=>`<div class="flex justify-between py-1.5 border-b border-slate-100"><span class="text-slate-500">${k}</span><b class="${k==='TOTAL'?'text-blue-600 text-base':'text-slate-900'}">${v}</b></div>`).join('')}</div>
  <div class="flex gap-3"><button onclick="toast('Quotation PDF generated (demo)');window.print()" class="${btnP} flex-1 flex items-center justify-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> Generate PDF</button><button onclick="quoAction('${q.id}','Sent');closeModal()" class="${btnG} flex-1 justify-center">Send Quotation</button></div>`)}
function quoAction(id,st){DB.quotations.find(q=>q.id===id).status=st;saveDB();toast("Quotation "+st.toLowerCase());renderQuotations()}
function quoToShipment(id){const q=DB.quotations.find(x=>x.id===id);const nid2="SHP-"+(5051+DB.shipments.length);DB.shipments.unshift({id:nid2,customer:q.customer,customerId:"",pickup:q.route.split(" → ")[0]||"Dubai",delivery:q.route.split(" → ")[1]||"Abu Dhabi",type:q.type,cargo:"Converted from "+q.id,weight:500,qty:10,vehicle:DB.vehicles[0].reg,driver:DB.drivers[0].name,pickupDate:daysAhead(0),expDate:daysAhead(3),actualDate:null,status:"Booking Confirmed",charges:quoCalc(q).total,additional:0,notes:"From quotation "+q.id});saveDB();toast("Converted to shipment "+nid2);navigate('shipments')}

// ============ FINANCE ============
function renderFinance(){const rev=DB.invoices.reduce((a,i)=>a+i.amount,0);const exp=DB.expenses.reduce((a,e)=>a+e.amount,0);const ar=DB.invoices.filter(i=>i.paid!=="Paid").reduce((a,i)=>a+i.amount,0);const {slice,total}=paginate(DB.invoices,finPage,8);
  $('#pageContent').innerHTML=`

function openInvoiceModal(id){const i=id?DB.invoices.find(x=>x.id===id):{customer:DB.customers[0].company,shipment:DB.shipments[0].id,date:daysAhead(0),due:daysAhead(14),amount:5000,paid:"Unpaid"};

  ${field("Status",`<select name="paid" class="${inp}">${["Paid","Unpaid","Partially Paid","Overdue"].map(s=>`<option ${i.paid===s?'selected':''}>${s}</option>`).join('')}</select>`)}

  $('#pageContent').innerHTML=`
  <div class="flex flex-wrap items-center gap-3 mb-5 animate-in"><div><h2 class="font-display text-xl font-bold text-slate-900">Notifications</h2><p class="text-xs text-slate-500">${DB.notifications.filter(n=>!n.read).length} unread • ${DB.notifications.length} total</p></div><div class="ml-auto flex gap-2"><button onclick="DB.notifications.forEach(n=>n.read=true);saveDB();renderNotifications();toast('All marked as read')" class="${btnG}"><i data-lucide="check-check" class="w-4 h-4"></i> Mark All Read</button><button onclick="DB.notifications=[];saveDB();renderNotifications();toast('Notifications cleared')" class="${btnG} !text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i> Clear All</button></div></div>
  <div class="space-y-3 max-w-3xl">${DB.notifications.length?DB.notifications.map(n=>`<div class="glass rounded-2xl p-4 flex gap-4 animate-in ${n.read?'opacity-60':''}"><div class="w-10 h-10 rounded-xl ${n.type==='danger'?'bg-rose-50 text-rose-600':n.type==='success'?'bg-emerald-50 text-emerald-600':n.type==='warning'?'bg-amber-50 text-amber-500':'bg-blue-50 text-blue-600'} flex items-center justify-center shrink-0"><i data-lucide="bell" class="w-5 h-5"></i></div><div class="flex-1 min-w-0"><p class="font-bold text-slate-900 text-sm">${n.title}</p><p class="text-xs text-slate-500 mt-0.5">${n.msg}</p><p class="text-[11px] text-slate-500 mt-1">${n.time}</p></div>${!n.read?`<button onclick="markRead(${n.id})" class="text-xs font-bold text-blue-600 shrink-0">Mark Read</button>`:""}</div>`).join(''):`<div class="glass rounded-3xl p-12 text-center text-slate-500"><i data-lucide="bell-off" class="w-10 h-10 mx-auto mb-3"></i><p>No notifications. You're all caught up!</p></div>`}</div>`;
}
function markRead(id){DB.notifications.find(n=>n.id===id).read=true;saveDB();updateBadge();renderNotifications()}
function renderAutomation(){
  $('#pageContent').innerHTML=`
  <div class="mb-5 animate-in"><h2 class="font-display text-xl font-bold text-slate-900">Automation Workflows</h2><p class="text-xs text-slate-500">Interactive mock automations — toggle to simulate live rules</p></div>
  <div class="grid sm:grid-cols-2 gap-4 max-w-4xl">${DB.automations.map((a,i)=>`<div class="glass rounded-3xl p-5 card-hover animate-in"><div class="flex items-start justify-between"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-violet-600 to-purple-400 flex items-center justify-center"><i data-lucide="zap" class="w-5 h-5 text-white"></i></div><div><p class="font-bold text-slate-900 text-sm">${a.name}</p><p class="text-xs text-slate-500">${a.desc}</p></div></div><button onclick="toggleAuto(${i})" class="w-12 h-7 rounded-full p-1 transition ${a.on?'bg-emerald-500':'bg-slate-300'}"><span class="block w-5 h-5 bg-white rounded-full transition ${a.on?'translate-x-5':''}"></span></button></div><p class="mt-3 text-[11px] font-bold ${a.on?'text-emerald-600':'text-slate-500'}">${a.on?'● ACTIVE — Running':'○ INACTIVE'}</p><button onclick="runAuto(${i})" class="${btnG} w-full justify-center mt-3 !py-2 text-xs"><i data-lucide="play" class="w-3.5 h-3.5"></i> Run Simulation</button></div>`).join('')}</div>`;
}
function toggleAuto(i){DB.automations[i].on=!DB.automations[i].on;saveDB();toast(DB.automations[i].name+(DB.automations[i].on?" activated":" deactivated"));renderAutomation()}
function runAuto(i){toast("Simulation: "+DB.automations[i].name+" executed ✓","info");DB.notifications.unshift({id:Date.now(),title:"Automation: "+DB.automations[i].name,msg:"Workflow executed successfully at "+new Date().toLocaleTimeString(),time:"Just now",read:false,type:"info"});saveDB();updateBadge()}

// ============ SETTINGS ============
function renderSettings(){const s=DB.settings;
  $('#pageContent').innerHTML=`
  <div class="mb-5 animate-in"><h2 class="font-display text-xl font-bold text-slate-900">Settings</h2><p class="text-xs text-slate-500">Company profile, currency, VAT & preferences</p></div>
  <div class="grid lg:grid-cols-2 gap-5 max-w-5xl">
  <div class="glass rounded-3xl p-6 animate-in"><h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2"><i data-lucide="building-2" class="w-5 h-5 text-blue-600"></i> Company Profile</h3>
  <form onsubmit="saveSettings(event)" class="space-y-4">
  ${field("Company Name",`<input name="company" required value="${s.company}" class="${inp}"/>`)}
  ${field("Location",`<input name="location" required value="${s.location}" class="${inp}"/>`)}
  ${field("Currency",`<select name="currency" class="${inp}">${["AED","USD","SAR","KWD"].map(c=>`<option ${s.currency===c?'selected':''}>${c}</option>`).join('')}</select>`)}
  ${field("VAT Rate (%)",`<input name="vat" type="number" step="0.5" required value="${s.vat}" class="${inp}"/>`)}
  ${field("Theme",`<select name="theme" class="${inp}">${["Dark Navy","Midnight","Ocean Blue"].map(t=>`<option ${s.theme===t?'selected':''}>${t}</option>`).join('')}</select>`)}
  <label class="flex items-center justify-between glass rounded-xl p-3.5 cursor-pointer"><span class="text-sm font-medium text-slate-900">Email Notifications</span><input type="checkbox" name="notif" ${s.notif?'checked':''} class="w-5 h-5 accent-cyan-500"/></label>
  <button class="${btnP} w-full">Save Settings</button></form></div>
  <div class="space-y-5">
    <div class="glass rounded-3xl p-6 animate-in"><h3 class="font-bold text-slate-900 mb-3 flex items-center gap-2"><i data-lucide="user" class="w-5 h-5 text-blue-600"></i> User Profile</h3><div class="flex items-center gap-4"><img src="https://i.pravatar.cc/80?img=12" class="w-16 h-16 rounded-full border-2 border-blue-100"/><div><p class="font-bold text-slate-900">Ahmed Al Mansoori</p><p class="text-xs text-slate-500">Managing Director • ahmed@zatura.ae</p><p class="text-xs text-slate-500">Dubai, UAE • Since 2021</p></div></div><button onclick="toast('Profile updated (demo)')" class="${btnG} w-full justify-center mt-4">Edit Profile</button></div>
    <div class="glass rounded-3xl p-6 animate-in"><h3 class="font-bold text-slate-900 mb-3 flex items-center gap-2"><i data-lucide="shield" class="w-5 h-5 text-blue-600"></i> Role Management</h3>${["Managing Director — Full Access","Operations Manager — Shipments & Dispatch","Finance Manager — Invoices & Reports","Fleet Manager — Vehicles & Drivers","Warehouse Manager — Inventory"].map(r=>`<div class="flex items-center justify-between py-2 border-b border-slate-100 text-sm"><span class="text-slate-700">${r}</span><span class="text-emerald-600 text-xs font-bold">● Active</span></div>`).join('')}</div>
    <div class="rounded-3xl p-6 bg-rose-50 border border-rose-200 animate-in"><h3 class="font-bold text-rose-700 mb-2">Danger Zone</h3><p class="text-xs text-slate-500 mb-4">Reset all demo data to original seed (50 shipments, 15 customers, etc.)</p><button onclick="confirmDlg('Reset ALL demo data? All your changes will be lost.',()=>{localStorage.removeItem('zatura_db_v2');loadDB();renderNav();renderPage();toast('Demo data reset successfully')})" class="w-full py-3 rounded-xl bg-rose-600 hover:bg-rose-500 font-bold text-white text-sm flex items-center justify-center gap-2"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset Demo Data</button></div>
  </div></div>`;
}
function saveSettings(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.vat=+d.vat;d.notif=!!d.notif;DB.settings=d;saveDB();toast("Settings saved successfully");renderSettings()}

// INIT
renderNav();renderPage();
document.addEventListener('click',e=>{if(!e.target.closest('#searchResults')&&!e.target.closest('#globalSearch'))$('#searchResults')?.classList.add('hidden');if(!e.target.closest('#profileMenu')&&!e.target.closest('[onclick*="profileMenu"]'))$('#profileMenu')?.classList.add('hidden')});
</script>
</body>
</html>
